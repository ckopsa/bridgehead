[package]
name = "wc3clone"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.16"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content data files (assets/data/*.ron). RON over JSON because the stat
# tables are full of Rust enums — `unlock: HeroLevel(5)`, `attack: Some((..))`
# — and RON round-trips them without inventing a tagging convention.
ron = "0.8"

# Fast-ish iterative builds: optimize deps, keep our code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
